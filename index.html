<style>
  :root{--navy:#0B2545;--amber:#FFB400;--red:#D8322B;--mint:#3DDC97;--paper:#FFF8EA;--dim:#5b6b80;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}

  svg#ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

  .top{position:fixed;top:0;left:0;right:0;z-index:5;background:rgba(11,37,69,.94);color:#fff;padding:calc(var(--sat) + 4px) 10px 6px}
  .row{display:flex;align-items:center;gap:8px;height:40px}
  .btn{height:36px;min-width:40px;padding:0 10px;border:2px solid rgba(255,255,255,.45);color:#fff;background:transparent;font:inherit;font-weight:800;font-size:14px;border-radius:10px}

#evt.show{pointer-events:auto;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
#evt .x{position:absolute;top:3px;right:7px;font-style:normal;font-size:14px;line-height:1;opacity:.55}
/* toast/WHY card placed at the top-left over the sea when the centre positions would cover a base (see placeEvt) */
#evt.side{left:8px;transform:translateY(-8px);max-width:48%;text-align:left} #evt.side.show{transform:translateY(0)}

html.compact .bars{grid-template-columns:auto 1fr auto 1fr;gap:2px 6px;margin-top:1px;font-size:9px} html.compact .bars span{white-space:nowrap} html.compact .bar{height:6px}
html.compact .sheet{padding:6px 8px calc(var(--sab) + 6px);gap:6px} html.compact .tb,html.compact #lom{min-height:48px;font-size:13px;border-radius:12px} html.compact .tb small{font-size:10.5px} html.compact #lom small{font-size:9px}

#rotate{display:none}

  #rotate{display:flex;position:fixed;inset:0;z-index:50;background:#0B2545;color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px}

}
/* web / desktop */
button,.sc.tap{cursor:pointer} .lv.lock{cursor:default}
.tb,#lom{position:relative} .tb kbd,#lom kbd{display:none}
@media (hover:hover) and (pointer:fine){
  canvas#m{cursor:crosshair}
  .tb:hover,.go:hover,.lv:not(.lock):hover,.scale:hover{filter:brightness(1.05)} .btn:hover{border-color:#fff}
  .tb kbd,#lom kbd{display:block;position:absolute;top:5px;right:7px;font:800 10px/1 ui-monospace,Menlo,monospace;padding:2px 4px;border-radius:4px;border:1px solid currentColor;opacity:.55}
}
@media (min-width:760px){ .top>.row,.top>.bars,.sheet>.hint,.sheet>.btns{width:100%;max-width:720px;margin-left:auto;margin-right:auto} }

  h+=`</div><button class="go alt" id="kn" style="margin-top:10px">Knobs</button> <button class="go alt" id="ua" style="margin-top:10px">Unlock all</button> <button class="go alt" id="nb" style="margin-top:10px">Notebook</button><button class="scale" id="rsb"><span class="sk">The real scale</span><span class="sh">2,551 ships. Maybe 17,000.</span><span class="ss">After the game: see what six patrol ships are up against</span><span class="sa">→</span></button>`; h+=`<p class="diag">${diag()}</p>`; show(h);
  document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{ audio(); LVL=+b.dataset.n-1; intro(); }); $('#kn').onclick=knobs; $('#nb').onclick=notebook; $('#rsb').onclick=()=>{ audio(); LVL=LEVELS.length-1; intro(); }; $('#ua').onclick=()=>{ save.all=true; persistL(); title(); }; }
function intro(){ const L=LEVELS[LVL]; S=null; note('facts',L.fact); show(`<div class="k">Level ${L.n} of ${LEVELS.length}</div><h2>${L.title}</h2><p>${L.fact}</p><p><b>${L.rule}</b></p>${L.goalTxt?`<p style="font-size:13px;color:#7a6a45">Goal: ${L.goalTxt}</p>`:''}<button class="go" id="go">Play</button> <button class="go alt" id="bk">Levels</button>`); $('#go').onclick=()=>{ audio(); start(); }; $('#bk').onclick=title; }
function start(){ FACTQ.length=0; makeLevel(); rec('start',{}); S.factT=1.5; S.mi=0; S.mLeft=null; S.failTxt=null; S.mScript=null; if(S.L.mfacts) S.L.mfacts.forEach(f=>f.shown=0); if(S.L.missions) startMission(0); redrawMap(); paintToolsMap(); hide(); }
function paintToolsMap(){}
function knobs(){ let h='<h2>Knobs</h2>'; for(const [k,label,mn,mx,st] of KNOBS) h+=(k==='swarm'?'<p style="font-size:11.5px;color:#5a6b7d;margin:6px 0 -2px">Real fleet: <b>2,551</b> official (China, 2023) ↔ <b>~17,000</b> able to fish distant waters (ODI 2020).</p>':'')+`<div class="knob"><span>${label}</span><input type="range" min="${mn}" max="${mx}" step="${st}" value="${KN[k]}" data-k="${k}"><b id="kv-${k}">${KN[k]}</b></div>`; h+=`<p style="font-size:12px;color:#7a6a45">Swarm size and cutters apply on restart; the rest apply live.</p><div class="knob"><span>Record play log</span><input type="checkbox" id="recOn" ${REC.on?'checked':''} style="width:22px;height:22px;flex:none"><b id="recN">${REC.log.length}</b></div><p style="font-size:12px;color:#7a6a45">For playtests: logs strokes, taps, facts, cards and results. Nothing leaves this device unless you download it.</p><button class="go alt" id="recDl" style="margin-bottom:10px">Download log</button> <button class="go alt" id="recClr" style="margin-bottom:10px">Clear</button><p class="diag">${diag()}</p><button class="go" id="kok">${S?'Resume':'Back'}</button> <button class="go alt" id="krs">Restart</button>`; show(h);
  $('#recOn').onchange=e=>{ REC.on=e.target.checked; rec('recording',{on:true}); $('#recN').textContent=REC.log.length; }; $('#recDl').onclick=recDownload; $('#recClr').onclick=()=>{ REC.log.length=0; $('#recN').textContent=0; };
  document.querySelectorAll('.knob input[type=range]').forEach(inp=>inp.oninput=()=>{ KN[inp.dataset.k]=parseFloat(inp.value); $('#kv-'+inp.dataset.k).textContent=inp.value; }); $('#kok').onclick=()=>{ if(S&&!S.ended){ S.paused=false; hide(); } else title(); }; $('#krs').onclick=()=>start(); }
function chart(){ const h=S.hist; if(h.length<2) return ''; const Wc=380,Hc=70; const pts=h.map((p,i)=>`${(i/(h.length-1)*Wc).toFixed(1)},${(Hc-p/100*Hc).toFixed(1)}`).join(' '); return `<svg viewBox="0 0 ${Wc} ${Hc}" width="100%" height="70" style="display:block;background:#fff;border:2px solid #0B2545;border-radius:10px;margin:0 0 10px"><polyline points="${pts}" fill="none" stroke="#4FC3F7" stroke-width="3"/></svg>`; }
function nextSeason(){ S.left+=SEASON; S.season=(S.season||1)+1; rec('season',{season:S.season,stock:Math.round(S.stock)}); const st=S.stock>50?3:S.stock>35?2:1; save.stars[S.L.n]=Math.max(save.stars[S.L.n]||0,st); save.best7=Math.max(save.best7||0,S.season-1); persistL();
  for(let i=0;i<25;i++) spawn('out'); SND.step(); toast(`<b>Season ${S.season}</b> · the fleet returns larger`,false,4500); }
function capOffer(){ S.paused=true; S.capT=0; SND.win(); show(`<span class="stamp ok">BEIJING OFFERS A CAP</span><p>Beijing will cap the fleet if the Letters of Marque end.</p><p style="font-size:13px;color:#7a6a45">The paper’s aim is a negotiated cap, not endless seizure.</p><button class="go" id="capY">Accept the cap</button> <button class="go alt" id="capN">Refuse · play on</button>`);
  $('#capY').onclick=()=>{ rec('cap',{choice:'accept'}); S.paused=false; hide(); end('cap'); }; $('#capN').onclick=()=>{ rec('cap',{choice:'refuse'}); S.paused=false; hide(); S.refused=(S.refused||0)+1; S.profitCap=100; S.profit=clamp(S.profit+30,0,100); for(let i=0;i<40;i++) spawn('out'); toast('<b>Refused.</b> Subsidies rise and more boats sail.',true,4500); }; }
function scaleGraphic(){ const N=S.need||{}, rows=[['Squid jiggers at Peru’s line','~400',N.local],['China’s official distant-water fleet','2,551',N.official],['Outside estimate','~17,000',N.estimate]];
  const max=Math.max(...rows.map(r=>r[2]||0),6);
  const bar=(w,col,label)=>`<div style="display:flex;align-items:center;gap:8px;margin:3px 0"><div style="height:14px;width:${Math.max(0.8,w/max*100)}%;background:${col};border-radius:3px;flex:none;max-width:72%"></div><span style="font-size:12.5px;font-weight:800;white-space:nowrap">${label}</span></div>`;
  return `<span class="stamp ok">THE REAL SCALE</span><p style="margin:8px 0 6px">Patrol ships needed to keep every fishing ship in radar range (~12 nm each), against the <b>6</b> Peru has.</p>`+
    rows.map(r=>`<div style="margin:10px 0 4px"><div style="font-size:13px;font-weight:800">${r[0]} · ${r[1]} ships</div>${bar(r[2]||0,'#3DDC97',`${(r[2]||0).toLocaleString('en-US')} needed`)}${bar(6,'#8a97a6','6 Peru has')}</div>`).join('')+
    `<p style="font-size:11.5px;color:#7a6a45;margin:6px 0 10px">The larger fleets are drawn as if all on Peru’s coast; in reality they fish every ocean. Radar range is a generous estimate against small boats.</p>`+
    `<div style="border-left:4px solid #D8322B;padding-left:9px;margin:10px 0"><b style="font-size:13.5px">Built for two jobs.</b><p style="font-size:13px;margin:4px 0">China’s 2015 rules set “national defense requirements” for building new civilian ships and refitting old ones, and a 2016–17 law lets the military call on them. Some maritime-militia fishing boats have strengthened hulls and ramming rails. US Naval War College analysts read PLA writing as treating civilian and militia ships as logistics for a possible Taiwan operation.</p><p style="font-size:11px;color:#7a6a45;margin:0">Sources: USCC testimony (Thorne, 2024); US DoD China report 2024; CMSI China Maritime Reports 21 & 25.</p></div>`; }
function end(kind){ if(S.ended) return; S.ended=kind; rec('end',{kind,stock:Math.round(S.stock),profit:Math.round(S.profit),relations:S.bj,boarded:S.boarded,tags:S.tags,records:S.records,bans:S.bans,listed:S.listed,taken:S.loms,season:S.season||1,mission:S.mi}); const L=S.L; const won=kind==='win'||kind==='cap'; won?SND.win():SND.end(); paintLom();
  let st=0; if(won){ st=1; if(S.stock>50) st=2; if(st===2&&L.stretch&&L.stretch(S)) st=3; if(!L.stretch&&S.stock>50) st=3; save.stars[L.n]=Math.max(save.stars[L.n]||0,st); }
  if(L.n===4&&!won) save.l4++; persistL();
  const head=L.scale?'<span class="stamp ok">THE REAL SCALE</span>':kind==='cap'?'<span class="stamp ok">BEIJING OFFERS A CAP</span>':won?'<span class="stamp ok">LEVEL CLEARED</span>':kind==='crisis'?'<span class="stamp">TRADE RETALIATION</span>':kind==='collapse'?'<span class="stamp">STOCK COLLAPSED</span>':S.failTxt?'<span class="stamp">MISSION FAILED</span>':'<span class="stamp">NOT ENOUGH</span>';
  const one=L.scale?'':`${S.boarded} boarded · ${S.records} records · ${S.bans} bans${T('list')?` · ${S.listed} listed`:''}${T('bounty')?` · ${S.loms} taken`:''}${L.endless?` · season ${S.season||1}`:''}`;
  let lesson=L.lesson, extra='', next='';
  const REAL={1:`You boarded ${S.boarded} boat${S.boarded===1?'':'s'}. Argentina has made about 80 seizures since 1986.`,2:`You watched ${S.reefers.filter(r=>r.known).length} motherships. In reality 30–150 of them serve the whole fleet.`,3:`One ban moved one ship. In 2022 the US sanctioned 157 vessels at once, and the fleet is still there.`,4:`Ecuador faces 200–300 ships near the Galápagos with a handful of patrol boats.`,5:`Letters of Marque: US Constitution, Art. I §8. Last issued by Madison in 1812.`,6:`Peru exports about $22.5B a year to China. That is the leverage behind trade retaliation.`,7:`The paper’s end goal is a negotiated cap on the fleet, not endless seizure.`,8:`Peru loses about $300M a year (2024), and up to ~$800M by outside estimates. Argentina’s legal squid quota is 150,000 t; 600–800,000 t are taken illegally.`};
  const realLine=REAL[L.n]?`<p style="font-size:13px;background:#eef3f8;border-radius:8px;padding:8px 10px;margin:8px 0"><b>Real world:</b> ${REAL[L.n]}</p>`:'';
  const simp=LIMIT[L.n]?`<p style="font-size:13px;border-left:4px solid #E0A52E;padding-left:8px;margin:8px 0"><b>What this simplifies:</b> ${LIMIT[L.n]}</p>`:L.n===7?`<details open style="font-size:13px;margin:8px 0"><summary style="font-weight:700;cursor:pointer">What this game simplified</summary><ul style="margin:6px 0 0;padding-left:18px;line-height:1.5"><li><b>Legality.</b> Most squid fishing past the line is unregulated, not illegal. On the high seas only the flag state may board a ship, so most states would treat privateer seizures as piracy.</li><li><b>Crews.</b> Seizing or disabling ships endangers crews who are often trafficked workers.</li><li><b>Cost and oversight.</b> The paper doesn’t price privateers or say who checks them.</li><li><b>Escalation.</b> Beijing could answer with militia pressure elsewhere or trade leverage; whether it stops after a third strike is unknown.</li><li><b>Scale.</b> The fleet is 2,551 vessels by China’s own count (2023) and up to ~17,000 able to fish distant waters (ODI 2020).</li><li><b>Not only China.</b> Spanish, Portuguese, Russian and Vanuatu-flagged ships work the same edges.</li></ul></details>`:''; if(!won&&S.failTxt) lesson=`<b>${S.failTxt}</b> Retry: it takes under a minute.`;
  if(L.n===4&&!won){ if(save.l4>=2){ extra=`<p style="border-left:4px solid #D8322B;padding-left:8px"><b>The US Congress authorises Letters of Marque and Reprisal. Peru provides the ports.</b></p>`; next=`<button class="go" id="nx">Level 5 →</button>`; } else { extra=`<p style="font-size:13px;color:#7a6a45">This season can’t be held with what you have. Try once more — or skip ahead.</p>`; next=`<button class="go alt" id="nx">Skip to Level 5</button>`; } }
  else if(won&&LVL<LEVELS.length-1) next=`<button class="go" id="nx">Next level →</button>`;
  if(kind==='cap') lesson='Beijing offers to cap the fleet in exchange for an end to the letters. The aim was never endless seizure.';
  setTimeout(()=>{ if(L.scale){ show(`${scaleGraphic()}<p>${lesson}</p>${argLadder(L.n)}<button class="go" id="again">Replay</button> <button class="go alt" id="lv">Levels</button>`); $('#again').onclick=()=>{ LVL=L.n-1; start(); }; $('#lv').onclick=title; return; } show(`${head}${won&&!L.scale?`<div style="font-size:26px;color:#E0A52E;margin:-4px 0 6px">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>`:''}${(S.failTxt&&!won)||L.scale?'':chart()}<p><b>${one}</b></p><p>${lesson}</p>${realLine}${simp}${argLadder(won||L.n===4?L.n:0)}${extra}${won&&L.stretchTxt&&st<3?`<p style="font-size:12.5px;color:#7a6a45">★★★: fish above 50 and ${L.stretchTxt}</p>`:''}${next} <button class="go ${next?'alt':''}" id="again">Retry</button> <button class="go alt" id="lv">Levels</button>`);
    if($('#nx')) $('#nx').onclick=()=>{ LVL=Math.min(LEVELS.length-1,L.n===4?4:LVL+1); intro(); }; $('#again').onclick=()=>{ LVL=L.n-1; start(); }; $('#lv').onclick=title; },700); }
$('#menubtn').onclick=()=>{ audio(); if(!S||S.ended){ title(); return; } S.paused=true; show(`<h2>Paused · Level ${S.L.n}</h2><p>${S.L.rule}</p><button class="go" id="res">Resume</button> <button class="go alt" id="rs">Restart</button> <button class="go alt" id="lv3">Levels</button> <button class="go alt" id="kn3">Knobs</button>`); $('#res').onclick=()=>{ S.paused=false; hide(); }; $('#rs').onclick=start; $('#lv3').onclick=title; $('#kn3').onclick=knobs; };
$('#knobbtn').onclick=()=>{ audio(); if(S&&!S.ended) S.paused=true; knobs(); };
addEventListener('keydown',e=>{ if(e.code==='Space'&&S&&!S.ended){ e.preventDefault(); if(S.paused&&$('#res')) $('#res').click(); else if(!S.paused) $('#menubtn').click(); } else if(e.code==='Escape'&&S&&!S.ended&&!S.paused) $('#menubtn').click();
  // desktop shortcuts for the three bottom buttons (ignored while typing, with modifiers, on key repeat, or when paused)
  else if(!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'')&&S&&!S.ended&&!S.paused){ const b={KeyP:'#b-plane',KeyH:'#b-heli',KeyB:'#lom'}[e.code]; if(b){ e.preventDefault(); $(b).click(); } } });
// switching tabs or minimising pauses the game instead of silently freezing it mid-wave
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S&&!S.ended&&!S.paused) $('#menubtn').click(); });
// phones held sideways get the template's "turn your phone upright" card; pause the game underneath it
try{ matchMedia('(orientation:landscape) and (max-height:500px) and (pointer:coarse)').addEventListener('change',e=>{ if(e.matches&&S&&!S.ended&&!S.paused) $('#menubtn').click(); }); }catch(e){}
let last=performance.now();
function frame(now){ const raw=Math.min(0.05,(now-last)/1000); last=now; tGlobal+=raw;
  if(S&&!S.ended&&!S.paused){ let dt=raw*S.speed*KN.speed; if(S.down) dt*=0.33; if(S.slow>0){ S.slow-=raw; dt*=0.3; } update(dt); updateFx(raw);
    const s=Math.max(0,Math.ceil(S.L.only&&S.mLeft!=null?S.mLeft:S.left)); $('#clock').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; $('#clock').style.textDecoration=S.passT<5?'underline':'none'; $('#budget').innerHTML=`<small>BUDGET</small>${Math.max(0,Math.round(S.budget))}`; $('#fbar i').style.width=S.stock+'%'; $('#fbar').className='bar'+(S.stock<30?' low':''); $('#pbar i').style.width=S.profit+'%'; const pips=$('#bj').children; for(let i=0;i<4;i++) pips[i].className=i<S.bj?'on':''; if((tGlobal*4|0)%2===0) paintLom(); }
  else updateFx(raw);
  draw(); flushOV(); paintSide(); requestAnimationFrame(frame); }
resize(); title(); requestAnimationFrame(frame);
window.ARMADA={REC,level:n=>{ LVL=n-1; start(); },LEVELS,save,state:()=>S,KN,start:()=>{start();},stroke:pts=>commitStroke(pts),P,S2M,inEEZ,fearAt:(u,v)=>fearAt(u,v),speed:n=>{ if(S) S.speed=n; },plane:()=>{ const [x,y]=P(S.air.hu,S.air.hv); tapAt({x,y}); },heli:r=>heliOn(r),bank:r=>bank(r),mission:i=>startMission(i),fire:id=>fireCard(CARDS.find(c=>c.id===id)),recall:k=>{ const A=k==='plane'?S.air:S.heli; if(A.state!=='port'&&A.state!=='refuel'){ A.state='home'; A.job=null; } },bounty:r=>postBounty(r),lom:letterOfMarque};

</script>
